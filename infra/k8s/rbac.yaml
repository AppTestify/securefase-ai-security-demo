apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-demo-runner
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-demo-cluster-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-demo-cluster-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-demo-cluster-admin
subjects:
  - kind: ServiceAccount
    name: ai-demo-runner
    namespace: prod
